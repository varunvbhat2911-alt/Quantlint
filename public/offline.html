<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantLint — Offline</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --fg: #ededed;
        --muted: #737373;
        --border: #1a1a1a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fcfcfc;
          --fg: #171717;
          --muted: #737373;
          --border: #e6e6e6;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 400px;
        text-align: center;
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      button {
        background: var(--fg);
        color: var(--bg);
        border: none;
        padding: 0.625rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">⚡</div>
      <h1>You're offline</h1>
      <p>
        QuantLint requires an internet connection to run strategy audits.
        Check your connection and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
